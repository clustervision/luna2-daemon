#
# This file is written to support the CI/CD process of Gitlab.
# Status: Production
# copyright: Copyright 2026, Luna2 Project
# license: GPL
#
# Build and publish the pip package. The build/publish logic lives once in
# ClusterVision/gitlab-cicd-pipelines rather than being copied into every project:
# it also points the target directory's "latest" symlinks at the build it just
# produced and prunes older ones, which the per-project version never did.
#
# Branch -> stream:  main -> $LOCATION,  development -> $DEV_LOCATION,
#                    ztp-poc -> $ZTPPOC_LOCATION (skipped where unset).
# Any other branch is built but not published.
#
# Required project CI/CD variables: LOCATION, DEV_LOCATION, IPADDRESS, SSH_USER,
# SSH_PASSWORD.
#

include:
  - project: 'ClusterVision/gitlab-cicd-pipelines'
    file: '/pip-package-pipeline.yml'
    ref: 'main'

#
# The 2.0 line is dormant (last touched February 2025) but main-2.0 and
# development-2.0 still exist and still publish, so their jobs are kept here rather
# than dropped. The shared pipeline covers main / development / ztp-poc only; these
# two are the local additions GitLab merges alongside it. Remove them when the 2.0
# branches go.
#
production-2.0:
  stage: publish
  image: python:3.10.0-alpine
  only:
    - main-2.0
  script:
    - python setup.py sdist bdist_wheel
    - apk add --no-cache openssh-client sshpass
    - sshpass -p $SSH_PASSWORD scp -r -oStrictHostKeyChecking=no dist/* $SSH_USER@$IPADDRESS:$LOCATION_20

development-2.0:
  stage: publish
  image: python:3.10.0-alpine
  only:
    - development-2.0
  script:
    - python setup.py sdist bdist_wheel
    - apk add --no-cache openssh-client sshpass
    - sshpass -p $SSH_PASSWORD scp -r -oStrictHostKeyChecking=no dist/* $SSH_USER@$IPADDRESS:$DEV_LOCATION_20
