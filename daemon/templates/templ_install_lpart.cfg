[ "$LPART_FALLBACK" = "1" ] && download_image
[ "$LPART_FALLBACK" = "1" ] && unpack_imagefile
collect_mac_n_name_net
change_net
node_secrets
postscript
lpart_phase post
{% if LUNA_ROLES %}
node_roles
{% endif %}
postboot
fix_capabilities
restore_selinux_context
update_system_info
update_inventory
cleanup
update_status "install.success"

