{% autoescape None %}
{% set ns = namespace(subnet_id=1) %}
{#- boot_subnet renders one Kea subnet4 object (no trailing comma). It is the single source of the
    standalone/relayed boot-subnet body: the plain SUBNETS loop below and the option-82.5
    shared-networks block share it, so they cannot drift. pool_class, when given, fences the pool.
    tests/regression pins this against the SUBNETS loop output. -#}
{% macro boot_subnet(ns, S, name, RESERVATIONS, ZONES, pool_class='') %}
      {
        "id": {{ ns.subnet_id }},
        {%- set ns.subnet_id = ns.subnet_id + 1 %}
        "subnet": "{{ S['network'] }}/{{ S['prefix'] }}",
        "valid-lifetime": 28800,
        {%- if S['dhcp_relay'] is defined %}
        "relay": { "ip-addresses": [ {% for RELAY in S['dhcp_relay'] %}"{{ RELAY }}"{% if not loop.last %}, {% endif %}{% endfor %} ] },
        {%- endif %}

        {%- if S['range_begin'] is defined and S['range_end'] is defined %}
        "pools": [
          {
	        "pool": "{{ S['range_begin'] }}-{{ S['range_end'] }}"{% if pool_class %},
            "client-class": "{{ pool_class }}"{% endif %}
	  }
        ],
        {%- endif %}
    {%- if name in RESERVATIONS and RESERVATIONS[name] | length > 0 %}
        "reservations": [
        {%- for HOST in RESERVATIONS[name] %}
          {
            "hw-address": "{{ HOST['macaddress'] }}",
            "ip-address": "{{ HOST['ipaddress'] }}",
            "hostname": "{{ HOST['name'] }}"
          {%- if HOST.get('nextserver') and not HOST.get('switch') %},
            "next-server": "{{ HOST['nextserver'] }}",
            "client-classes": [ "{{ HOST['ipxe_kernel_class'] }}" ]
          {%- endif %}
          {%- if HOST.get('switch') and HOST.get('nextserver') %},
            "next-server": "{{ HOST['nextserver'] }}"
          {%- if HOST.get('bootfile') %},
            "boot-file-name": "http://{{ HOST['nextserver'] }}:{{ HOST['nextport'] }}/{{ HOST['bootfile'] }}"
          {%- endif %}
          {%- if HOST.get('default_url') %},
            "option-data": [ { "name": "v4-captive-portal", "data": "http://{{ HOST['nextserver'] }}:{{ HOST['nextport'] }}/{{ HOST['default_url'] }}" } ]
          {%- endif %}
          {%- endif %}
          {%- if loop.last %}
          }
          {%- else %}
          },
          {%- endif -%}
        {%- endfor %}
        ],
    {%- endif -%}
    {%- if name in ZONES %}
        "ddns-qualifying-suffix": "{{ ZONES[name]['domain'] }}.",
    {%- endif -%}
    {%- if S['nextserver'] is defined %}
        "next-server": "{{ S['nextserver'] }}",
    {%- endif %}
        "option-data": [
    {%- if S['nextserver'] is defined %}
	  { "name": "tftp-server-name", "data": "{{ S['nextserver'] }}" },
    {%- endif -%}
    {%- if S['nameserver_ip'] %}
          { "name": "domain-name-servers", "data": "{{ S['nameserver_ip'] }}" },
    {%- endif -%}
    {%- if S['ntp_server'] and S['ntp_server_kind'] == 'ipv4' %}
          { "name": "ntp-servers", "data": "{{ S['ntp_server'] }}" },
    {%- endif -%}
    {%- if S['gateway'] is defined %}
          { "name": "routers", "data": "{{ S['gateway'] }}" },
    {%- endif -%}
    {%- if S['domain'] is defined %}
          { "name": "domain-name", "data": "{{ S['domain'] }}" },
    {%- endif %}
          { "name": "luna-id", "data": "lunaclient" }
        ]
      }
{%- endmacro %}
#
# DHCP Server Configuration file.
# created by Luna
#

{
  "Dhcp4": {
    "authoritative": true,

    "ddns-send-updates": true,
    "ddns-override-client-update": true,
    "ddns-override-no-update": true,
    "dhcp-ddns": {
      "enable-updates": true,
      "server-ip": "127.0.0.1",
      "server-port": 53001
    },

    "interfaces-config": {
        "interfaces": [ "*" ], 
        "dhcp-socket-type": "raw"
    },

    "lease-database": {
        "type": "memfile",
        "persist": true,
        "name": "kea-leases4.csv",
        "lfc-interval": 1800,
        "max-row-errors": 100
    },

    "option-def": [
      {
        "name": "luna-id",
        "code": 129,
        "space": "dhcp4",
        "type": "string"
      }
    ],

{% if LINKSEL %}    "shared-networks": [
{%- for NET in LINKSEL %}
      {
        "name": "{{ NET }}-linksel",
        "subnet4": [
        {%- for ANCHOR in LINKSEL[NET]['anchor'] %}
          {
            "id": {{ ns.subnet_id }},
            {%- set ns.subnet_id = ns.subnet_id + 1 %}
            "subnet": "{{ ANCHOR }}",
            "authoritative": false,
            "pools": [ ]
          },
        {%- endfor %}
{{ boot_subnet(ns, LINKSEL[NET]['boot'], NET, RESERVATIONS, ZONES, NET + '-boot-class') }}
        ]
      }{% if not loop.last %},{% endif %}
{%- endfor %}
    ],
{% endif %}
    "subnet4": [
{%- for SHARE in SHARED -%}
    {%- for SUBNET in SHARED[SHARE] %}
      {
        "id": {{ ns.subnet_id }},
        {%- set ns.subnet_id = ns.subnet_id + 1 %}
        "subnet": "{{ SHARED[SHARE][SUBNET]['network'] }}/{{ SHARED[SHARE][SUBNET]['prefix'] }}",
        "valid-lifetime": 28800,
        {%- if SHARED[SHARE][SUBNET]['dhcp_relay'] is defined %}
        "relay": { "ip-addresses": [ {% for RELAY in SHARED[SHARE][SUBNET]['dhcp_relay'] %}"{{ RELAY }}"{% if not loop.last %}, {% endif %}{% endfor %} ] },
        {%- else %}
        {%- if SUBNET in POOLS %}
        "client-class": "{{ POOLS[SUBNET]['members']|first }}-class",
        {%- elif SHARE in POOLS and SUBNET not in POOLS %}
        "client-class": "
            {%- for MEMBER in POOLS[SHARE]['members'] -%}
                not member('{{ MEMBER }}-class')
                {%- if not loop.last %} and {% endif -%}
            {%- endfor -%}
            ",
        {%- endif %}
        {%- endif %}

        {%- if SUBNET in POOLS or (SHARE in POOLS and SUBNET not in POOLS) %}
            {%- if SUBNET in POOLS %}
                {%- if POOLS[SUBNET]['range_begin'] is defined and POOLS[SUBNET]['range_end'] is defined %}
        "pools": [
          {
            "pool": "{{ POOLS[SUBNET]['range_begin'] }}-{{ POOLS[SUBNET]['range_end'] }}"
          }
        ],
                {%- endif %}
            {%- elif SHARE in POOLS and SUBNET not in POOLS %}
                {%- if POOLS[SHARE]['range_begin'] is defined and POOLS[SHARE]['range_end'] is defined %}
        "pools": [
          {
            "pool": "{{ POOLS[SHARE]['range_begin'] }}-{{ POOLS[SHARE]['range_end'] }}"
          }
        ],
                {%- endif %}
            {%- endif %}
        {%- endif %}

        {%- if SUBNET in RESERVATIONS and RESERVATIONS[SUBNET] | length > 0 %}
        "reservations": [
            {%- for HOST in RESERVATIONS[SUBNET] %}
          {
            "hw-address": "{{ HOST['macaddress'] }}",
            "ip-address": "{{ HOST['ipaddress'] }}",
            "hostname": "{{ HOST['name'] }}"
                {%- if HOST.get('nextserver') and not HOST.get('switch') %},
            "next-server": "{{ HOST['nextserver'] }}",
            "client-classes": [ "{{ HOST['ipxe_kernel_class'] }}" ]
                {%- endif %}
                {%- if HOST.get('switch') and HOST.get('nextserver') %},
            "next-server": "{{ HOST['nextserver'] }}"
                {%- if HOST.get('bootfile') %},
            "boot-file-name": "http://{{ HOST['nextserver'] }}:{{ HOST['nextport'] }}/{{ HOST['bootfile'] }}"
                {%- endif %}
                {%- if HOST.get('default_url') %},
            "option-data": [ { "name": "v4-captive-portal", "data": "http://{{ HOST['nextserver'] }}:{{ HOST['nextport'] }}/{{ HOST['default_url'] }}" } ]
                {%- endif %}
                {%- endif %}
                {%- if loop.last %}
          }
                {%- else %}
          },
                {%- endif -%}
            {%- endfor %}
        ],
        {%- endif -%}
        {%- if SUBNET in ZONES %}
        "ddns-qualifying-suffix": "{{ ZONES[SUBNET]['domain'] }}.",
        {%- endif -%}
        {%- if SHARED[SHARE][SUBNET]['nextserver'] is defined %}
        "next-server": "{{ SHARED[SHARE][SUBNET]['nextserver'] }}",
        {%- endif %}
        "option-data": [
        {%- if SHARED[SHARE][SUBNET]['nextserver'] is defined %}
	  { "name": "tftp-server-name", "data": "{{ SHARED[SHARE][SUBNET]['nextserver'] }}" },
        {%- endif -%}
        {%- if SHARED[SHARE][SUBNET]['nameserver_ip'] %}
          { "name": "domain-name-servers", "data": "{{ SHARED[SHARE][SUBNET]['nameserver_ip'] }}" },
        {%- endif -%}
        {%- if SHARED[SHARE][SUBNET]['ntp_server'] and SHARED[SHARE][SUBNET]['ntp_server_kind'] == 'ipv4' %}
          { "name": "ntp-servers", "data": "{{ SHARED[SHARE][SUBNET]['ntp_server'] }}" },
        {%- endif -%}
        {%- if SHARED[SHARE][SUBNET]['gateway'] is defined %}
          { "name": "routers", "data": "{{ SHARED[SHARE][SUBNET]['gateway'] }}" },
        {%- endif -%}
        {%- if SHARED[SHARE][SUBNET]['domain'] is defined %}
          { "name": "domain-name", "data": "{{ SHARED[SHARE][SUBNET]['domain'] }}" },
        {%- endif %}
          { "name": "luna-id", "data": "lunaclient" }
        ]
        {%- if loop.last and SUBNETS|length == 0 %}
      }
        {%- else %}
      },
        {%- endif %}
    {%- endfor -%}
{%- endfor -%}

{% for SUBNET in SUBNETS %}
      {
        "id": {{ ns.subnet_id }},
        {%- set ns.subnet_id = ns.subnet_id + 1 %}
        "subnet": "{{ SUBNETS[SUBNET]['network'] }}/{{ SUBNETS[SUBNET]['prefix'] }}",
        "valid-lifetime": 28800,
        {%- if SUBNETS[SUBNET]['dhcp_relay'] is defined %}
        "relay": { "ip-addresses": [ {% for RELAY in SUBNETS[SUBNET]['dhcp_relay'] %}"{{ RELAY }}"{% if not loop.last %}, {% endif %}{% endfor %} ] },
        {%- endif %}

        {%- if SUBNETS[SUBNET]['range_begin'] is defined and SUBNETS[SUBNET]['range_end'] is defined %}
        "pools": [
          {
	        "pool": "{{ SUBNETS[SUBNET]['range_begin'] }}-{{ SUBNETS[SUBNET]['range_end'] }}"
	  }
        ],
        {%- endif %}
    {%- if SUBNET in RESERVATIONS and RESERVATIONS[SUBNET] | length > 0 %}
        "reservations": [
        {%- for HOST in RESERVATIONS[SUBNET] %}
          {
            "hw-address": "{{ HOST['macaddress'] }}",
            "ip-address": "{{ HOST['ipaddress'] }}",
            "hostname": "{{ HOST['name'] }}"
          {%- if HOST.get('nextserver') and not HOST.get('switch') %},
            "next-server": "{{ HOST['nextserver'] }}",
            "client-classes": [ "{{ HOST['ipxe_kernel_class'] }}" ]
          {%- endif %}
          {%- if HOST.get('switch') and HOST.get('nextserver') %},
            "next-server": "{{ HOST['nextserver'] }}"
          {%- if HOST.get('bootfile') %},
            "boot-file-name": "http://{{ HOST['nextserver'] }}:{{ HOST['nextport'] }}/{{ HOST['bootfile'] }}"
          {%- endif %}
          {%- if HOST.get('default_url') %},
            "option-data": [ { "name": "v4-captive-portal", "data": "http://{{ HOST['nextserver'] }}:{{ HOST['nextport'] }}/{{ HOST['default_url'] }}" } ]
          {%- endif %}
          {%- endif %}
          {%- if loop.last %}
          }
          {%- else %}
          },
          {%- endif -%}
        {%- endfor %}
        ],
    {%- endif -%}
    {%- if SUBNET in ZONES %}
        "ddns-qualifying-suffix": "{{ ZONES[SUBNET]['domain'] }}.",
    {%- endif -%}
    {%- if SUBNETS[SUBNET]['nextserver'] is defined %}
        "next-server": "{{ SUBNETS[SUBNET]['nextserver'] }}",
    {%- endif %}
        "option-data": [
    {%- if SUBNETS[SUBNET]['nextserver'] is defined %}
	  { "name": "tftp-server-name", "data": "{{ SUBNETS[SUBNET]['nextserver'] }}" },
    {%- endif -%}
    {%- if SUBNETS[SUBNET]['nameserver_ip'] %}
          { "name": "domain-name-servers", "data": "{{ SUBNETS[SUBNET]['nameserver_ip'] }}" },
    {%- endif -%}
    {%- if SUBNETS[SUBNET]['ntp_server'] and SUBNETS[SUBNET]['ntp_server_kind'] == 'ipv4' %}
          { "name": "ntp-servers", "data": "{{ SUBNETS[SUBNET]['ntp_server'] }}" },
    {%- endif -%}
    {%- if SUBNETS[SUBNET]['gateway'] is defined %}
          { "name": "routers", "data": "{{ SUBNETS[SUBNET]['gateway'] }}" },
    {%- endif -%}
    {%- if SUBNETS[SUBNET]['domain'] is defined %}
          { "name": "domain-name", "data": "{{ SUBNETS[SUBNET]['domain'] }}" },
    {%- endif %}
          { "name": "luna-id", "data": "lunaclient" }
        ]
    {%- if loop.last %}
      }
    {%- else %}
      },
    {%- endif %}
{%- endfor %}
    ],

    "client-classes": [
{%- for CLASS in CLASSES %}
      {
        "name": "{{ CLASSES[CLASS]['network'] }}-class",
        "test": "substring(option[vendor-class-identifier].text, 0, 5) == 'udhcp'"
      },
{%- endfor -%}
{%- for NET in LINKSEL %}
      {
        "name": "{{ NET }}-boot-class",
        "test": "(not relay4[5].exists) or (option[93].hex == 0x0007) or (option[93].hex == 0x000b) or (option[93].hex == 0x000e) or (option[77].hex == 'iPXE') or (substring(option[60].hex, 0, 5) == 'udhcp')"
      },
        {%- if LINKSEL[NET]['boot']['nextserver'] is defined %}
      {
        "name": "ipxe-{{ NET }}",
        "test": "option[77].hex == 'iPXE'",
        "boot-file-name": "http://{{ LINKSEL[NET]['boot']['nextserver'] }}:{{ LINKSEL[NET]['boot']['nextport'] }}/boot"
      },
        {%- endif %}
{%- endfor -%}
{%- for SHARE in SHARED -%}
    {%- for SUBNET in SHARED[SHARE] -%}
        {%- if SHARED[SHARE][SUBNET]['nextserver'] is defined %}
      {
        "name": "ipxe-{{ SHARE }}-{{ SUBNET }}",
        "test": "option[77].hex == 'iPXE'",
        "boot-file-name": "http://{{ SHARED[SHARE][SUBNET]['nextserver'] }}:{{ SHARED[SHARE][SUBNET]['nextport'] }}/boot"
      },
        {%- endif -%}
    {%- endfor -%}
{%- endfor -%}
{%- for SUBNET in SUBNETS -%}
    {%- if SUBNETS[SUBNET]['nextserver'] is defined %}
      {
        "name": "ipxe-{{ SUBNET }}",
        "test": "option[77].hex == 'iPXE'",
        "boot-file-name": "http://{{ SUBNETS[SUBNET]['nextserver'] }}:{{ SUBNETS[SUBNET]['nextport'] }}/boot"
      },
    {%- endif -%}
{%- endfor %}
      {
        "name": "ipxe-kernel-default",
        "test": "0 == 1"
      },
      {
        "name": "ipxe-kernel-alternative",
        "test": "0 == 1"
      },
      {
        "name": "ipxe-kernel-default-x86",
        "test": "member('ipxe-kernel-default') and option[93].hex == 0x0007",
        "boot-file-name": "luna_ipxe.efi"
      },
      {
        "name": "ipxe-kernel-default-arm64",
        "test": "member('ipxe-kernel-default') and option[93].hex == 0x000b",
        "boot-file-name": "luna_ipxe_arm64.efi"
      },
      {
        "name": "ipxe-kernel-alternative-x86",
        "test": "member('ipxe-kernel-alternative') and option[93].hex == 0x0007",
        "boot-file-name": "luna_snponly.efi"
      },
      {
        "name": "ipxe-kernel-alternative-arm64",
        "test": "member('ipxe-kernel-alternative') and option[93].hex == 0x000b",
        "boot-file-name": "luna_snponly_arm64.efi"
      },
      {
        "name": "arch-x86",
        "test": "option[93].hex == 0x0007",
        #"only-in-additional-list": true,
        "boot-file-name": "luna_ipxe.efi"
      },
      {
        "name": "arch-arm64",
        "test": "option[93].hex == 0x000b",
        #"only-in-additional-list": true,
        "boot-file-name": "luna_ipxe_arm64.efi"
      },
      {
        # petit boot. we do nothing for openpower
        "name": "arch-openpower",
        #"only-in-additional-list": true,
        "test": "option[93].hex == '0x000e'"
      },
      {
        "name": "default",
        #"only-in-additional-list": true,
        "boot-file-name": "luna_undionly.kpxe"
      }
    ],

    "loggers": [
      {
        "name": "kea-dhcp4",
        "output_options": [
          {
            "output": "kea-dhcp4.log"
          }
        ],
        #"severity": "DEBUG",
        "severity": "WARN",
        "debuglevel": 1
      },
      {
        "name": "kea-dhcp4.classifier",
        "output_options": [{"output": "stdout"}],
        #"severity": "DEBUG",
        "severity": "WARN",
        "debuglevel": 1
      }
    ]
  }
}

{% endautoescape  %}
