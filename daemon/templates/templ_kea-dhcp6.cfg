{% autoescape None %}
{% set ns = namespace(subnet_id=1) %}
{#- boot_subnet6 renders one Kea subnet6 object (no trailing comma), shared by the SUBNETS loop and
    the option-82.5 (link-address) shared-networks block so they cannot drift. DHCPv6 has no NAK, so
    there is no authoritative flag; the pool is fenced with a pool-level client-class when pool_class
    is given (the subnet itself stays selectable so the anchor can reach it). -#}
{% macro boot_subnet6(ns, S, name, RESERVATIONS, ZONES, INTERFACES, pool_class='', group='') %}
      {
        "id": {{ ns.subnet_id }},
        {%- set ns.subnet_id = ns.subnet_id + 1 %}
        "subnet": "{{ S['network'] }}/{{ S['prefix'] }}",
        "valid-lifetime": 28800,
        {%- if S['dhcp_relay'] is defined %}
        "relay": { "ip-addresses": [ {% for RELAY in S['dhcp_relay'] %}"{{ RELAY }}"{% if not loop.last %}, {% endif %}{% endfor %} ] },
        {%- endif %}
        {#- one class NAME, never a list: the list spelling is kea 3.0 only and kea 2.6 refuses the
            whole configuration, which holds DHCPv4 back with it. utils/config builds the class. -#}
        {%- if S['select_class'] is defined %}
        "client-class": "{{ S['select_class'] }}",
        {%- endif %}
        {#- Only a directly connected subnet names an interface. A subnet with no controller
            interface in range falls back to FALLBACK_INTERFACE ([DHCP] INTERFACE6 in luna.ini)
            and, where that is unset, is left without one: a relayed subnet is selected by its
            relay anyway, and one that is neither is named in the daemon log by dhcp_overwrite.
            Nothing is emitted by default because kea refuses the WHOLE configuration - every
            other subnet with it - when given an interface the host does not have, so the name
            has to come from whoever knows the controller. -#}
        {%- if name in INTERFACES %}
        "interface": "{{ INTERFACES[name] }}",
        {%- elif group and group in INTERFACES %}
        "interface": "{{ INTERFACES[group] }}",
        {%- elif FALLBACK_INTERFACE %}
        "interface": "{{ FALLBACK_INTERFACE }}",
        {%- endif %}
        {%- if S['range_begin'] is defined and S['range_end'] is defined %}
        "pools": [
          {
	        "pool": "{{ S['range_begin'] }}-{{ S['range_end'] }}"{% if pool_class %},
            "client-class": "{{ pool_class }}"{% endif %}
	  }
        ],
        {%- endif %}
    {%- if name in RESERVATIONS and RESERVATIONS[name] | length > 0 %}
        "reservations": [
        {%- for HOST in RESERVATIONS[name] %}
          {
            "hw-address": "{{ HOST['macaddress'] }}",
            "ip-addresses": ["{{ HOST['ipaddress'] }}"],
            "hostname": "{{ HOST['name'] }}"
          {%- if HOST.get('nextserver') and not HOST.get('switch') %},
            "client-classes": [ "{{ HOST['ipxe_kernel_class'] }}" ]
          {%- endif %}
          {%- if HOST.get('switch') and HOST.get('nextserver') %},
            "option-data": [
              { "name": "bootfile-url", "data": "http://[{{ HOST['nextserver'] }}]:{{ HOST['nextport'] }}/{{ HOST['bootfile'] }}" }
            ]
          {%- endif %}
          {%- if loop.last %}
          }
          {%- else %}
          },
          {%- endif -%}
        {%- endfor %}
        ],
    {%- endif -%}
    {%- if name in ZONES %}
        "ddns-qualifying-suffix": "{{ ZONES[name]['domain'] }}.",
    {%- endif %}
        "option-data": [
    {%- if S['nameserver_ip_ipv6'] %}
          { "name": "dns-servers", "csv-format": true, "data": "{{ S['nameserver_ip_ipv6'] }}" },
    {%- endif -%}
    {%- if S['ntp_server_kind'] == 'ipv6' %}
          { "name": "ntp-server-srv-addr", "space": "ntp-server", "data": "{{ S['ntp_server'] }}" },
    {%- elif S['ntp_server_kind'] == 'fqdn' %}
          { "name": "ntp-server-srv-fqdn", "space": "ntp-server", "data": "{{ S['ntp_server'] }}" },
    {%- endif -%}
    {%- if S['domain'] is defined %}
          { "name": "domain-search", "csv-format": true, "data": "{{ S['domain'] }}" },
    {%- endif %}
          { "name": "luna-id", "data": "lunaclient" }
        ]
      }
{%- endmacro %}
#
# DHCP Server Configuration file.
# created by Luna
#

{
  "Dhcp6": {
    "ddns-send-updates": true,
    "ddns-override-client-update": true,
    "ddns-override-no-update": true,
    "dhcp-ddns": {
      "enable-updates": true,
      "server-ip": "127.0.0.1",
      "server-port": 53001
    },

    "interfaces-config": {
        "interfaces": [ "*" ]
    },

    "lease-database": {
        "type": "memfile",
        "persist": true,
        "name": "kea-leases6.csv",
        "lfc-interval": 1800,
        "max-row-errors": 100
    },

    "option-def": [
      {
        "name": "luna-id",
        "code": 129,
        "space": "dhcp6",
        "type": "string"
      },
      {#- DHCPv6 NTP server (option 56, RFC 5908) is a container; the address goes in its srv-addr
          sub-option (code 1). Kea encapsulates option 56 automatically when this sub-option is set. -#}
      {
        "name": "ntp-server-srv-addr",
        "code": 1,
        "space": "ntp-server",
        "type": "ipv6-address"
      },
      {
        "name": "ntp-server-srv-fqdn",
        "code": 3,
        "space": "ntp-server",
        "type": "fqdn"
      }
    ],

{% if LINKSEL or SHARED %}    "shared-networks": [
{%- for NET in LINKSEL %}
      {
        "name": "{{ NET }}-linksel",
        "subnet6": [
        {%- for ANCHOR in LINKSEL[NET]['anchor'] %}
          {
            "id": {{ ns.subnet_id }},
            {%- set ns.subnet_id = ns.subnet_id + 1 %}
            "subnet": "{{ ANCHOR }}",
            "pools": [ ]
          },
        {%- endfor %}
{{ boot_subnet6(ns, LINKSEL[NET]['boot'], NET, RESERVATIONS, ZONES, INTERFACES, NET + '-boot-class') }}
        ]
      }{% if not loop.last or SHARED %},{% endif %}
{%- endfor %}
{%- for SHARE in SHARED %}
      {
        "name": "{{ SHARE }}",
        "subnet6": [
        {%- for ANCHOR in ANCHOR.get(SHARE, []) %}
          {
            "id": {{ ns.subnet_id }},
            {%- set ns.subnet_id = ns.subnet_id + 1 %}
            "subnet": "{{ ANCHOR }}",
            "pools": [ ]
          },
        {%- endfor %}
    {%- for SUBNET in SHARED[SHARE] %}
{{ boot_subnet6(ns, SHARED[SHARE][SUBNET], SUBNET, RESERVATIONS, ZONES, INTERFACES, SHARED[SHARE][SUBNET].get('pool_class', ''), SHARE) }}{% if not loop.last %},{% endif %}
    {%- endfor %}
        ]
      }{% if not loop.last %},{% endif %}
{%- endfor %}
    ],
{% endif %}
    "subnet6": [
{% for SUBNET in SUBNETS %}
      {
        "id": {{ ns.subnet_id }},
        {%- set ns.subnet_id = ns.subnet_id + 1 %}
        "subnet": "{{ SUBNETS[SUBNET]['network'] }}/{{ SUBNETS[SUBNET]['prefix'] }}",
        "valid-lifetime": 28800,
        {%- if SUBNETS[SUBNET]['dhcp_relay'] is defined %}
        "relay": { "ip-addresses": [ {% for RELAY in SUBNETS[SUBNET]['dhcp_relay'] %}"{{ RELAY }}"{% if not loop.last %}, {% endif %}{% endfor %} ] },
        {%- endif %}
        {%- if SUBNET in INTERFACES %}
        "interface": "{{ INTERFACES[SUBNET] }}",
        {%- elif FALLBACK_INTERFACE %}
        "interface": "{{ FALLBACK_INTERFACE }}",
        {%- endif %}
        "client-class": "{{ SUBNETS[SUBNET]['select_class'] }}",

        {%- if SUBNETS[SUBNET]['range_begin'] is defined and SUBNETS[SUBNET]['range_end'] is defined %}
        "pools": [
          {
	        "pool": "{{ SUBNETS[SUBNET]['range_begin'] }}-{{ SUBNETS[SUBNET]['range_end'] }}"
	  }
        ],
        {%- endif %}
    {%- if SUBNET in RESERVATIONS and RESERVATIONS[SUBNET] | length > 0 %}
        "reservations": [
        {%- for HOST in RESERVATIONS[SUBNET] %}
          {
            "hw-address": "{{ HOST['macaddress'] }}",
            "ip-addresses": ["{{ HOST['ipaddress'] }}"],
            "hostname": "{{ HOST['name'] }}"
          {%- if HOST.get('nextserver') and not HOST.get('switch') %},
            "client-classes": [ "{{ HOST['ipxe_kernel_class'] }}" ]
          {%- endif %}
          {%- if HOST.get('switch') and HOST.get('nextserver') %},
            "option-data": [
              { "name": "bootfile-url", "data": "http://[{{ HOST['nextserver'] }}]:{{ HOST['nextport'] }}/{{ HOST['bootfile'] }}" }
            ]
          {%- endif %}
          {%- if loop.last %}
          }
          {%- else %}
          },
          {%- endif -%}
        {%- endfor %}
        ],
    {%- endif -%}
    {%- if SUBNET in ZONES %}
        "ddns-qualifying-suffix": "{{ ZONES[SUBNET]['domain'] }}.",
    {%- endif %}
        "option-data": [
    {%- if SUBNETS[SUBNET]['nameserver_ip_ipv6'] %}
          { "name": "dns-servers", "csv-format": true, "data": "{{ SUBNETS[SUBNET]['nameserver_ip_ipv6'] }}" },
    {%- endif -%}
    {%- if SUBNETS[SUBNET]['ntp_server_kind'] == 'ipv6' %}
          { "name": "ntp-server-srv-addr", "space": "ntp-server", "data": "{{ SUBNETS[SUBNET]['ntp_server'] }}" },
    {%- elif SUBNETS[SUBNET]['ntp_server_kind'] == 'fqdn' %}
          { "name": "ntp-server-srv-fqdn", "space": "ntp-server", "data": "{{ SUBNETS[SUBNET]['ntp_server'] }}" },
    {%- endif -%}
    {%- if SUBNETS[SUBNET]['domain'] is defined %}
          { "name": "domain-search", "csv-format": true, "data": "{{ SUBNETS[SUBNET]['domain'] }}" },
    {%- endif %}
          { "name": "luna-id", "data": "lunaclient" }
        ]
    {%- if loop.last %}
      }
    {%- else %}
      },
    {%- endif %}
{%- endfor %}
    ],

    "client-classes": [
{%- for CLASS in CLASSES %}
      {
        "name": "{{ CLASSES[CLASS]['network'] }}-class",
        "test": "substring(option[16].text, 0, 5) == 'udhcp'"
      },
{%- endfor -%}
{%- for NET in LINKSEL %}
      {
        "name": "{{ NET }}-boot-class",
        "test": "(substring(option[16].hex, 6, 9) == 'PXEClient') or (option[61].hex == 0x0007) or (option[61].hex == 0x000b) or (option[61].hex == 0x000e) or (substring(option[15].hex, 2, 4) == 'iPXE') or (substring(option[16].text, 0, 5) == 'udhcp')"
      },
        {%- if LINKSEL[NET]['boot']['nextserver'] is defined %}
      {
        "name": "ipxe-{{ NET }}",
        "test": "substring(option[15].hex,2,4) == 'iPXE'",
        "option-data": [
          {
            "name": "bootfile-url",
            "code": 59,
            "data": "http://[{{ LINKSEL[NET]['boot']['nextserver'] }}]:{{ LINKSEL[NET]['boot']['nextport'] }}/boot"
          }
        ]
      },
        {%- endif %}
{%- endfor -%}
{%- for SHARE in SHARED -%}
    {%- for SUBNET in SHARED[SHARE] -%}
        {%- if SHARED[SHARE][SUBNET]['nextserver'] is defined %}
      {
        "name": "ipxe-{{ SHARE }}-{{ SUBNET }}",
        "test": "substring(option[15].hex,2,4) == 'iPXE'",
        "option-data": [
          {
            "name": "bootfile-url",
            "code": 59,
            "data": "http://[{{ SHARED[SHARE][SUBNET]['nextserver'] }}]:{{ SHARED[SHARE][SUBNET]['nextport'] }}/boot"
          }
        ]
      },
        {%- endif -%}
    {%- endfor -%}
{%- endfor -%}

{%- for SUBNET in SUBNETS -%}
    {%- if SUBNETS[SUBNET]['nextserver'] is defined %}
      {
        "name": "ipxe-{{ SUBNET }}",
        "test": "substring(option[15].hex,2,4) == 'iPXE'",
        "option-data": [
          {
            "name": "bootfile-url",
            "code": 59,
            "data": "http://[{{ SUBNETS[SUBNET]['nextserver'] }}]:{{ SUBNETS[SUBNET]['nextport'] }}/boot"
          }
        ]
      },
    {%- endif -%}
{%- endfor -%}

{%- for SHARE in SHARED -%}
    {%- for SUBNET in SHARED[SHARE] -%}
        {%- if SHARED[SHARE][SUBNET]['nextserver'] is defined %}
      {
        "name": "arch-x86-{{ SHARE }}-{{ SUBNET }}",
        "test": "option[61].hex == 0x0007",
        #"only-in-additional-list": true,
        "option-data": [
          {
            "name": "bootfile-url",
            "code": 59,
            "data": "tftp://{{ SHARED[SHARE][SUBNET]['nextserver'] }}/luna_ipxe.efi"
          }
        ]
      },
      {
        "name": "arch-arm64-{{ SHARE }}-{{ SUBNET }}",
        "test": "option[61].hex == 0x000b",
        #"only-in-additional-list": true,
        "option-data": [
          {
            "name": "bootfile-url",
            "code": 59,
            "data": "tftp://{{ SHARED[SHARE][SUBNET]['nextserver'] }}/luna_ipxe_arm64.efi"
          }
        ]
      },
        {%- endif -%}
    {%- endfor -%}
{%- endfor -%}

      {
        "name": "ipxe-kernel-default",
        "test": "0 == 1"
      },
      {
        "name": "ipxe-kernel-alternative",
        "test": "0 == 1"
      },
      {%- for BOOTFILE in [{'class': 'default', 'arch': 'x86', 'file': 'luna_ipxe.efi'}, {'class': 'default', 'arch': 'arm64', 'file': 'luna_ipxe_arm64.efi'}, {'class': 'alternative', 'arch': 'x86', 'file': 'luna_snponly.efi'}, {'class': 'alternative', 'arch': 'arm64', 'file': 'luna_snponly_arm64.efi'}] %}
      {%- for SUBNET in SUBNETS -%}
        {%- if SUBNETS[SUBNET]['nextserver'] is defined %}
      {
        "name": "ipxe-kernel-{{ BOOTFILE['class'] }}-{{ BOOTFILE['arch'] }}-{{ SUBNET }}",
        "test": "member('ipxe-kernel-{{ BOOTFILE['class'] }}') and member('arch-{{ BOOTFILE['arch'] }}-{{ SUBNET }}')",
        "option-data": [
          {
            "name": "bootfile-url",
            "code": 59,
            "data": "tftp://{{ SUBNETS[SUBNET]['nextserver'] }}/{{ BOOTFILE['file'] }}"
          }
        ]
      },
        {%- endif -%}
      {%- endfor -%}
      {%- for SHARE in SHARED -%}
        {%- for SUBNET in SHARED[SHARE] -%}
          {%- if SHARED[SHARE][SUBNET]['nextserver'] is defined %}
      {
        "name": "ipxe-kernel-{{ BOOTFILE['class'] }}-{{ BOOTFILE['arch'] }}-{{ SHARE }}-{{ SUBNET }}",
        "test": "member('ipxe-kernel-{{ BOOTFILE['class'] }}') and member('arch-{{ BOOTFILE['arch'] }}-{{ SHARE }}-{{ SUBNET }}')",
        "option-data": [
          {
            "name": "bootfile-url",
            "code": 59,
            "data": "tftp://{{ SHARED[SHARE][SUBNET]['nextserver'] }}/{{ BOOTFILE['file'] }}"
          }
        ]
      },
          {%- endif -%}
        {%- endfor -%}
      {%- endfor -%}
      {%- endfor %}

{%- for SUBNET in SUBNETS -%}
    {%- if SUBNETS[SUBNET]['nextserver'] is defined %}
      {
        "name": "arch-x86-{{ SUBNET }}",
        "test": "option[61].hex == 0x0007",
        #"only-in-additional-list": true,
        "option-data": [
          {
            "name": "bootfile-url",
            "code": 59,
            "data": "tftp://{{ SUBNETS[SUBNET]['nextserver'] }}/luna_ipxe.efi"
          }
        ]
      },
      {
        "name": "arch-arm64-{{ SUBNET }}",
        "test": "option[61].hex == 0x000b",
        #"only-in-additional-list": true,
        "option-data": [
          {
            "name": "bootfile-url",
            "code": 59,
            "data": "tftp://{{ SUBNETS[SUBNET]['nextserver'] }}/luna_ipxe_arm64.efi"
          }
        ]
      },
    {%- endif -%}
{%- endfor %}
      {
        # petit boot. we do nothing for openpower
        "name": "arch-openpower",
        #"only-in-additional-list": true,
        "test": "option[93].hex == '0x000e'"
      }
{%- for SHARE in ANCHOR %},
      {
        "name": "{{ SHARE }}-boot-class",
        "test": "(substring(option[16].hex, 6, 9) == 'PXEClient') or (option[61].hex == 0x0007) or (option[61].hex == 0x000b) or (option[61].hex == 0x000e) or (substring(option[15].hex, 2, 4) == 'iPXE') or (substring(option[16].text, 0, 5) == 'udhcp')"
      }
{%- endfor -%}
{#- derived classes come last: every one of them names classes defined above, and kea refuses a
    member() reference to a class defined later in the list. -#}
{%- for CLASS in DERIVED %},
      {
        "name": "{{ CLASS['name'] }}",
        "test": "{{ CLASS['test'] }}"
      }
{%- endfor %}
    ],

    "loggers": [
      {
        "name": "kea-dhcp6",
        "output_options": [
          {
            "output": "kea-dhcp6.log"
          }
        ],
        #"severity": "DEBUG",
        "severity": "WARN",
        "debuglevel": 1
      },
      {
        "name": "kea-dhcp6.classifier",
        "output_options": [{"output": "stdout"}],
        #"severity": "DEBUG",
        "severity": "WARN",
        "debuglevel": 1
      }
    ]
  }
}

{% endautoescape  %}
