[pytest]
# luna2-daemon test configuration.
# 'daemon' is on the path so tests import the package as the daemon does (utils.*, common.*).
# 'tests' is on the path so the data-driven case tables import as `cases.*`.
pythonpath = daemon tests
testpaths = tests
# one run of this suite writes 230 MB under tmp_path and pytest keeps three of them by
# default; /tmp is 2 GB shared by every session on a build box, and that filled it
tmp_path_retention_count = 1
markers =
    regression: golden/baseline tests that pin current behaviour against stored expectations.
